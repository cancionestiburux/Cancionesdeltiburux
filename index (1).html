<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las canciones de Agustín el tiburux</title>
<style>
:root{--bg:#E6E1FF;--ink:#1B1340;--muted:#5B4F93;--a:#D4264E;--b:#0A7F5F;--btn-ink:#FFFFFF;--accent:#6B2FD6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120D26;--ink:#F3EFFF;--muted:#A99FD6;--a:#FF6B8E;--b:#3EE0A8;--btn-ink:#120D26;--accent:#FFC247;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120D26;--ink:#F3EFFF;--muted:#A99FD6;--a:#FF6B8E;--b:#3EE0A8;--btn-ink:#120D26;--accent:#FFC247;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Trebuchet MS",sans-serif;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow-x:hidden}
h1{margin:0;font-size:clamp(1.8rem,7vw,3rem);line-height:1.1}
p{margin:0;color:var(--muted);font-size:1.15rem}
video{width:100%;max-width:960px;aspect-ratio:16/9;background:#000;border-radius:14px;border:3px solid var(--accent)}
a.song{display:block;width:100%;max-width:420px;box-sizing:border-box;padding:20px 16px;border-radius:18px;font-size:1.4rem;font-weight:800;text-decoration:none;color:var(--btn-ink)}
a.s1{background:var(--a)}a.s2{background:var(--b)}
a.back{color:var(--muted);font-size:1.05rem}
a:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<h1>Las canciones de Agustín el tiburux</h1>
<p>Toca una canción para ver su video</p>
<a class="song s1" href="ver-escuela.html">🏫 Estoy en la escuela</a>
<a class="song s2" href="ver-bidiojuegos.html">🎮 Rap de los bidiojuegos</a>
</body>
</html>
